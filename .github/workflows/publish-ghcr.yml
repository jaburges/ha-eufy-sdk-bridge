# Build the multi-arch bridge image, and publish it to GitHub Container Registry.
#
# Image:   ghcr.io/<owner>/<repo>, lowercased from `github.repository` — so a fork publishes under its
#          own account with no edit here.
# Trigger → tags pushed (one manifest carrying linux/amd64 + linux/arm64; node:24-alpine has no arm/v7):
#   push to main           → :latest, :sha-<short>
#   push of a tag vX.Y.Z   → :X.Y.Z, :X.Y, :latest, :sha-<short>   (the tag must match package.json)
#                            a pre-release tag (vX.Y.Z-rc.1) → :X.Y.Z-rc.1, :sha-<short> only
#   pull request           → :pr-<number>, :sha-<short> when the PR branch lives in this repository, so
#                            a branch can be pulled and tested before it is merged; build only from a
#                            fork (its token cannot write packages)
#   manual run             → :sha-<short>, plus whatever the selected ref earns above
# Publishing a GitHub Release creates its tag, which is the tag push above.
#
# Uses the docker CLI in shell rather than the docker/* marketplace actions, because the upstream org's
# Actions policy allows only actions owned by mega-yfue or created by GitHub — so `actions/checkout` is
# fine, but `docker/build-push-action` etc. are not. buildx is preinstalled on the runner; arm64
# emulation comes from a `tonistiigi/binfmt` image pull (an image, not an action). Push uses the
# built-in GITHUB_TOKEN via `packages: write`.
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and tags
        id: meta
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_FROM_THIS_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS=("$IMAGE:sha-${HEAD_SHA::7}")
          PUSH=true
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if [ "$PR_FROM_THIS_REPO" = "true" ]; then
              TAGS+=("$IMAGE:pr-$PR_NUMBER")
            else
              PUSH=false
            fi
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAGS+=("$IMAGE:latest")
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            if [[ ! "$VER" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag '$GITHUB_REF_NAME' is not semver (vX.Y.Z)"
              exit 1
            fi
            if [ "$VER" != "$VERSION" ]; then
              echo "::error::tag version '$VER' does not match package.json '$VERSION' — bump package.json to match before tagging"
              exit 1
            fi
            TAGS+=("$IMAGE:$VER")
            if [ -z "${BASH_REMATCH[4]}" ]; then
              TAGS+=("$IMAGE:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" "$IMAGE:latest")
            fi
          fi
          {
            echo "image=$IMAGE"
            echo "push=$PUSH"
            echo "version=$VERSION"
            echo "revision=$HEAD_SHA"
            echo "tags<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Image: $IMAGE (push=$PUSH)"
          printf '  %s\n' "${TAGS[@]}"

      - name: Enable arm64 emulation (binfmt)
        run: docker run --rm --privileged tonistiigi/binfmt --install arm64

      - name: Create a buildx builder
        run: docker buildx create --use --name eufy-ci --driver docker-container

      - name: Log in to GHCR
        if: steps.meta.outputs.push == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build (and push unless this is a pull request)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PUSH: ${{ steps.meta.outputs.push }}
          VERSION: ${{ steps.meta.outputs.version }}
          REVISION: ${{ steps.meta.outputs.revision }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(--tag "$t"); done <<< "$TAGS"
          [ "$PUSH" = "true" ] && args+=(--push)
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${REVISION}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            "${args[@]}" \
            .

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PUSH: ${{ steps.meta.outputs.push }}
        run: |
          {
            if [ "$PUSH" = "true" ]; then echo "### Published"; else echo "### Built (not pushed — pull request from a fork)"; fi
            echo ""
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo ""
            while IFS= read -r t; do [ -n "$t" ] && echo "- \`$t\`"; done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
